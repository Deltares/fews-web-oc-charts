name: Build library and examples

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: npm run build
      - run: npm run build-examples
