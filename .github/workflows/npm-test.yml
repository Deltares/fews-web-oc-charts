name: Run tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Check formatting, lint and types
        run: npx vp check

      - name: Get installed Playwright version
        id: playwright-version
        run: |
          echo "PLAYWRIGHT_VERSION=$(npm ls playwright --depth=0 --package-lock-only --json \
            | sed -n '/\"playwright\": {/,/}/ s/.*\"version\": \"\([^\"]*\)\".*/playwright@\1/p')" >> $GITHUB_ENV

      - name: Cache playwright binaries
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Run tests
        run: npm run test:all-browsers

  visual:
    runs-on: ubuntu-24.04
    # Firefox and WebKit baselines depend on this image's fonts and rendering, and WebKit's canvas
    # also on the CPU architecture. Keep the tag equal to the installed Playwright version and to
    # the test:visual:docker script.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      # Firefox refuses to start when HOME belongs to another user.
      HOME: /root
    steps:
      - uses: actions/checkout@v5
      - run: npm ci --ignore-scripts
      - name: Run visual regression
        run: npm run test:visual
